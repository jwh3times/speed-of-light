name: Release

# Releases every merge to main with a three-part SemVer tag and a Windows zip (`Scheme:
# stamp-on-tag`, docs/adr/0001-stamp-changelog-on-tag.md).
#
#   1. `tag` runs `scripts/stamp-changelog.mjs`, which walks main's first-parent history back to
#      the newest `v<major>.<minor>.<build>` tag and, for each untagged merge, oldest first:
#        - builds its dated CHANGELOG.md section from the `changelog.d/` fragments that merge added,
#          or from its PR title when it added none (a Dependabot PR, a docs-only change);
#        - computes its version the way `scripts/next-version.mjs` does, from VERSION at that merge
#          and the tags so far;
#        - tags the merge commit itself, so a tag is exactly the code that merge built.
#      It makes one stamp commit, `chore(release): v<x.y.z>[, ...] [skip ci]`, that adds the
#      sections and deletes the used fragments. The job pushes that commit and the tags in one
#      atomic push, then creates a GitHub Release per tag from its section.
#   2. `package` builds each tag this run released on Windows, from the tag (the merge commit, never
#      the stamp commit that follows it on main), and uploads the zip and its checksum to that
#      tag's Release.
#
# The push uses a token from the release GitHub App, which the main ruleset lists as its one bypass
# actor: `GITHUB_TOKEN` cannot bypass a ruleset. The App's client ID is the RELEASE_APP_CLIENT_ID
# variable and its private key the RELEASE_APP_PRIVATE_KEY secret. `[skip ci]` keeps the App's push
# from starting CI or this workflow again. Nothing deploys from main, so nothing else acts on the
# stamp commit.
#
# To see which release a checkout corresponds to: git describe --tags

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Stamp the changelog and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create with GITHUB_TOKEN
    # Stamps take turns and never cancel a running one. GitHub still replaces a waiting run when a
    # newer one queues; that is harmless, because a stamp starts from main's tip and releases every
    # untagged merge, and its `package` job builds each of them.
    concurrency:
      group: release-tag
      cancel-in-progress: false
    outputs:
      tags: ${{ steps.stamp.outputs.tags }}
    steps:
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # main's tip, not the pushed commit: a later merge may already be on it
          fetch-depth: 0 # full history and tags, needed to find the untagged merges
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Stamp the changelog and push the tags
        id: stamp
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"

          node scripts/stamp-changelog.mjs --notes-dir "$RUNNER_TEMP/notes" > "$RUNNER_TEMP/tags.txt"
          if [ ! -s "$RUNNER_TEMP/tags.txt" ]; then
            echo "Every merge on main is tagged; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "result=none" >> "$GITHUB_OUTPUT"
            echo "tags=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags=$(cut -d' ' -f1 "$RUNNER_TEMP/tags.txt")

          refs=()
          for tag in $tags; do refs+=("refs/tags/${tag}"); done
          if ! git push --atomic origin HEAD:main "${refs[@]}" 2> "$RUNNER_TEMP/push.log"; then
            cat "$RUNNER_TEMP/push.log" >&2
            # Only main moving is benign: the run waiting behind this one stamps both merges and
            # packages both releases.
            if grep -Eq 'HEAD -> main \((fetch first|non-fast-forward)\)' "$RUNNER_TEMP/push.log"; then
              echo "::notice::main moved during this run; the next run releases these merges."
              echo "result=deferred" >> "$GITHUB_OUTPUT"
              echo "tags=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          cat "$RUNNER_TEMP/push.log" >&2
          echo "result=released" >> "$GITHUB_OUTPUT"
          # The released tags as a JSON list, the `package` job's matrix.
          echo "tags=$(printf '%s\n' $tags | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Releases
        if: steps.stamp.outputs.result == 'released'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### Released" >> "$GITHUB_STEP_SUMMARY"
          while read -r tag sha; do
            gh release create "$tag" \
              --verify-tag \
              --title "Speed of Light ${tag#v}" \
              --notes-file "$RUNNER_TEMP/notes/${tag}.md"
            echo "- \`${tag}\` on \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/tags.txt"

  package:
    name: Build the Windows zip (${{ matrix.tag }})
    needs: tag
    if: needs.tag.outputs.tags != '' && needs.tag.outputs.tags != '[]'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload with GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tag.outputs.tags) }}
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ matrix.tag }}
      GH_TOKEN: ${{ github.token }}
      # The MSVC C runtime linked in statically, so the binaries need no Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }} # the merge commit the tag is on, not main's stamp commit
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # rust-toolchain.toml pins the compiler, as in CI. No build cache: a release is built clean.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Cargo.toml's workspace version holds the release line (x.y.0); the binaries report the tag's
      # full version instead. `cargo update --workspace` changes only Cargo.lock's own workspace
      # entries, so --locked still holds every dependency at the reviewed version.
      - name: Set the version to the tag's
        shell: bash
        run: |
          node scripts/check-cargo-version.mjs --set "${TAG#v}"
          cargo update --workspace
          git diff --stat

      - name: Build
        run: cargo build --release --locked -p sol-cli -p sol-service

      - name: The binaries report the tag
        shell: bash
        run: |
          for bin in sol sol-service; do
            out=$("./target/release/${bin}.exe" --version)
            echo "$out"
            [ "$out" = "${bin} ${TAG#v}" ] || { echo "::error::${bin} reports '${out}', not ${TAG#v}"; exit 1; }
          done

      - name: Package and upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "speed-of-light-$env:TAG-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/examples/profiles" | Out-Null
          Copy-Item target/release/sol.exe, target/release/sol-service.exe, README.md, LICENSE, SECURITY.md $dir
          Copy-Item examples/profiles/*.toml "$dir/examples/profiles"
          Copy-Item examples/config.toml "$dir/examples"
          gh release view $env:TAG --json body --jq .body | Set-Content -Encoding utf8NoBOM "$dir/RELEASE-NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw "gh release view $env:TAG failed" }
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding utf8NoBOM dist/SHA256SUMS.txt
          gh release upload $env:TAG "dist/$name.zip" dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload $env:TAG failed" }
          "### ``$env:TAG``: ``$name.zip`` (sha256 ``$hash``)" >> $env:GITHUB_STEP_SUMMARY
