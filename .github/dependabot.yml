# Dependabot version updates, checked every day at 05:00 US Eastern. Security updates are a
# repository setting (Settings > Advanced Security) and are not limited by the schedule here.
#
# Minor and patch updates arrive as one pull request per ecosystem. Majors arrive one at a time.
# The Rust toolchain in rust-toolchain.toml is the minimum supported version, moved on purpose
# with `rust-version` in Cargo.toml, so no entry here bumps it.
version: 2
updates:
  # The Rust workspace: Cargo.toml and Cargo.lock at the root.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Action versions in .github/workflows, pinned by commit with a version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
